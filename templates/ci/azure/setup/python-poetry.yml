          - task: UsePythonVersion@0
            inputs:
              versionSpec: "@{python}"
          - task: Cache@2
            inputs:
              key: 'poetry | "$(Agent.OS)" | poetry.lock'
              path: $(POETRY_CACHE_DIR)
          - script: |
              pip install poetry==@{tool:poetry}
              @{install}
            displayName: Install
