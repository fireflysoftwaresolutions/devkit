          - task: JavaToolInstaller@0
            inputs:
              versionSpec: "@{java}"
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
          - task: Cache@2
            inputs:
              key: 'gradle | "$(Agent.OS)" | **/*.gradle* | gradle/wrapper/gradle-wrapper.properties'
              path: $(GRADLE_USER_HOME)/caches
