# CI/CD for @{project}, generated by `dev ci init` on @{date}.
# Pull requests and pushes to @{branch} run the checks; a release tag (@{tag_format}) also builds, signs and keeps the
# release files. Run the same commands locally before you push (`dev ci --run`); check changes with `dev ci audit`.
trigger:
  batch: true # pushes in a row share one run
  branches:
    include: [@{branch}]
  tags:
    include: ["@{tag_az}"]

pr:
  autoCancel: true # a newer push to the pull request cancels the running build
  branches:
    include: ["*"]

pool:
  vmImage: ubuntu-24.04

variables:
@{variables}

stages:
  - stage: checks
    jobs:
@{jobs}
  - stage: release
    dependsOn: checks
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
    jobs:
@{release}
