# CI/CD for @{project}, generated by `dev ci init` on @{date}.
# Pull requests and pushes to @{branch} run the checks; a release tag (@{tag_format}) also builds, signs and
# publishes to Downloads. Run the same commands locally before you push (`dev ci --run`); check with `dev ci audit`.
# Bitbucket cannot cancel superseded runs automatically: keep these steps short.
options:
  max-time: 30

definitions:
  caches:
@{caches}
  services:
    docker:
      memory: 2048
  steps:
@{steps}

pipelines:
  pull-requests:
    "**":
@{flow}
  branches:
    @{branch}:
@{flow}
  tags:
    "@{tag_bb}":
@{flow}
@{release_flow}
