# CI/CD for @{project}, generated by `dev ci init` on @{date}.
# Merge requests and pushes to the default branch run the checks; a release tag (@{tag_format}) also builds, signs
# and publishes. Run the same commands locally before you push (`dev ci --run`); check changes with `dev ci audit`.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # the merge request pipeline runs instead
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ @{tag_regex}
  auto_cancel:
    on_new_commit: interruptible

stages: [lint, test, integration, build, release]

default:
  interruptible: true # a newer push cancels this pipeline; release jobs opt out
  timeout: 30m
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure] # infrastructure only, never tests

@{setups}
@{jobs}
