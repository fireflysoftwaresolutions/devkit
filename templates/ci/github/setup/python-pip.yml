      - uses: @{uses:actions/checkout}
        with:
          persist-credentials: false
      - uses: @{uses:actions/setup-python}
        with:
@{#python_file}
          python-version-file: .python-version
@{/python_file}
@{^python_file}
          python-version: "@{python}"
@{/python_file}
@{#pip_cache}
@{#cache}
          cache: pip
@{/cache}
@{/pip_cache}
@{#install}
      - name: Install
        run: |
          @{install}
@{/install}
