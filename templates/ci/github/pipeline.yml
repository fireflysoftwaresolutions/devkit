# @{title}, generated by `dev ci init` on @{date}.
@{#release_wf}
# Runs on a release tag (@{tag_format}): the test gate and the build again, without caches (a cache must never feed a
# release), the scans, then the SBOM, the provenance attestation, the GitHub release and a check of what was published.
@{/release_wf}
@{^release_wf}
# Pull requests and pushes to @{branch} run the checks; release tags run release.yml. Run the same commands locally
# before you push (`dev ci --run`); check changes with `dev ci audit`.
@{/release_wf}
name: @{wf_name}

on:
@{#release_wf}
  push:
    tags: ["@{tag_glob}"]
@{/release_wf}
@{^release_wf}
  pull_request:
  push:
    branches: [@{branch}]
@{/release_wf}

permissions:
  contents: read # least privilege: a job that needs more asks for it

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
@{#release_wf}
  cancel-in-progress: false # a release always runs to the end
@{/release_wf}
@{^release_wf}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a newer push replaces a PR run; main runs finish
@{/release_wf}

jobs:
@{jobs}
