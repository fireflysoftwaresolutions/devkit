# The bug registry: folds the payload comments of each registry issue into the one record comment the bot writes,
# and sets the fixed version of bugs when a release is published (tools/bug_registry_action.py).
# The script reads the event from the file GitHub writes. No expression here reads event text: the concurrency group
# uses only the numeric issue or release id, so the runs of one issue wait for each other and none is cancelled.
# The repository secret BUG_REGISTRY_KEY keys the digests that count distinct voters; without it the run folds nothing.
name: bug registry

on:
  issues:
    types: [opened]
  # Payloads arrive as comments from any account, so this trigger is the registry's input. The job checks out the
  # default branch (never pull request code), passes the script only the runner's event file path and event name,
  # writes nothing to GITHUB_ENV or GITHUB_OUTPUT, and holds issues: write and contents: read alone.
  issue_comment: # zizmor: ignore[dangerous-triggers] reviewed: comments are read as data by the script, never run
    types: [created]
  release:
    types: [published]

permissions: {}

jobs:
  fold:
    name: Fold registry payloads
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # the record comment, labels, titles, closing duplicates and reopening regressions
      contents: read # the checkout of the script, and the list of releases
    concurrency:
      group: bug-registry-${{ github.event.issue.number || github.event.release.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fold
        run: python3 tools/bug_registry_action.py "$GITHUB_EVENT_PATH" "$GITHUB_EVENT_NAME"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUG_REGISTRY_KEY: ${{ secrets.BUG_REGISTRY_KEY }}
