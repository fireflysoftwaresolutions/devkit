# devkit CI: the confirmation of a local run, not the test runner (AGENTS.md §7).
# Run the same thing locally first: python3 -m unittest discover -s tests && /usr/bin/python3 -m unittest discover -s tests
# A draft pull request runs no job: the one run starts when it is marked ready for review (ready_for_review), and
# every push after that runs again. On a push to main, github.event.pull_request is null, which equals false.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    if: github.event.pull_request.draft == false # drafts wait for ready_for_review
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q lib bin
      - name: Unit tests
        run: python -m unittest discover -s tests
        env:
          DEVKIT_NO_NOTIFY: "1"

  security:
    name: Security scans
    if: github.event.pull_request.draft == false # drafts wait for ready_for_review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secrets (gitleaks)
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir --redact --no-banner .
      - name: Code (semgrep)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
          semgrep scan --config p/default --error --metrics off --disable-version-check
      - name: Dependencies (osv-scanner)
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 scan source -r --allow-no-lockfiles .
      - name: Filesystem and IaC (trivy)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs node_modules --skip-dirs .venv .
      - name: Workflows (zizmor)
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --offline --min-severity medium .github/workflows
