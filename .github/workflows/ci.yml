# devkit CI: the confirmation of a local run, not the test runner (AGENTS.md §7).
# Run the same thing locally first: python3 -m unittest discover -s tests -t . && /usr/bin/python3 -m unittest discover -s tests -t .
# (-t . runs tests/ as a package, so tests/__init__.py gives the run a temporary home: tests/_hermetic.py)
# A draft pull request runs no job: the one run starts when it is marked ready for review (ready_for_review), and
# every push after that runs again. On a push to main, github.event.pull_request is null, which equals false.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python }}, part ${{ matrix.shard }} of 2)
    if: github.event.pull_request.draft == false # drafts wait for ready_for_review
    runs-on: macos-latest
    # the whole suite took about 46 minutes on one runner (4,701 tests in 26.11.19); each part runs half of it,
    # so the four test jobs fit the five macOS jobs a GitHub Free account runs at a time
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # every commit and tag: the installer's upgrade tests run against this repository's own releases
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q lib bin
      - name: Prepare native analysis evidence
        run: |
          native_dir=$(mktemp -d "${TMPDIR:-/tmp}/devkit-native.XXXXXX")
          echo "DEVKIT_NATIVE_EVIDENCE=$native_dir" >> "$GITHUB_ENV"
      - name: Native static analysis
        run: |
          native_dir=${DEVKIT_NATIVE_EVIDENCE:-}
          if [ -z "$native_dir" ]; then native_dir=$(mktemp -d "${TMPDIR:-/tmp}/devkit-native.XXXXXX"); fi
          echo "Native analysis evidence: $native_dir"
          python3 scripts/security_corpus.py --native-output "$native_dir/native.json"
      - name: Preserve native analysis evidence
        if: always() && env.DEVKIT_NATIVE_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-analysis-${{ matrix.python }}-part-${{ matrix.shard }}
          path: ${{ env.DEVKIT_NATIVE_EVIDENCE }}/native.json
          if-no-files-found: error
          retention-days: 14
      - name: Unit tests
        # Part DEVKIT_TEST_PART of PARTS: every PARTS-th test file by name, then the real-state check of this part's
        # run; the parts together take each test file once. Where the matrix is not expanded (dev ci --run gives no
        # part), the step runs the whole suite, the delivery policy's test gate, never a part of it: the part has a
        # name of devkit's own, so a SHARD the developer's shell exports never makes the local gate a part.
        run: |
          if [ -z "${DEVKIT_TEST_PART:-}" ]; then
            python -m unittest discover -s tests -t .
            exit
          fi
          modules=$(cd tests && for f in test_*.py; do [ "$f" = test_zz_real_state_untouched.py ] || echo "$f"; done |
            awk -v n="${PARTS:-1}" -v k="$DEVKIT_TEST_PART" '(NR - 1) % n == k - 1 { sub(/[.]py$/, ""); print "tests." $0 }')
          if [ -z "$modules" ]; then echo "no test file in part $DEVKIT_TEST_PART of ${PARTS:-1}" >&2; exit 1; fi
          # shellcheck disable=SC2086 # one module name per word
          python -m unittest $modules tests.test_zz_real_state_untouched
        env:
          DEVKIT_NO_NOTIFY: "1"
          PARTS: "2"
          DEVKIT_TEST_PART: ${{ matrix.shard }}

  security:
    name: Security scans
    if: github.event.pull_request.draft == false # drafts wait for ready_for_review
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # the serial Semgrep scan takes about 11 minutes on a fast Mac, longer on the runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secrets (gitleaks)
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir --redact --no-banner .
      - name: Prepare security evidence
        run: |
          scan_dir=$(mktemp -d "${TMPDIR:-/tmp}/devkit-security.XXXXXX")
          echo "SECURITY_EVIDENCE=$scan_dir" >> "$GITHUB_ENV"
      - name: Code (semgrep)
        run: |
          scan_dir=${SECURITY_EVIDENCE:-}
          if [ -z "$scan_dir" ]; then scan_dir=$(mktemp -d "${TMPDIR:-/tmp}/devkit-security.XXXXXX"); fi
          echo "Security evidence: $scan_dir"
          # A worktree's .git file names its git directory inside the main checkout's: the scan lists its sources with
          # git, so the shared git directory is mounted too, read-only, at a fixed path, and GIT_DIR names this
          # checkout's git directory inside it (a mount at the host's own path is empty under some Docker VMs).
          git_common=$(git rev-parse --path-format=absolute --git-common-dir)
          git_dir=$(git rev-parse --absolute-git-dir)
          docker run --rm -v "$PWD:/src:ro" -v "$git_common:/gitcommon:ro" -v "$scan_dir:/evidence" -w /src \
            -e GIT_DIR="/gitcommon${git_dir#"$git_common"}" -e GIT_WORK_TREE=/src -e PYTHONDONTWRITEBYTECODE=1 \
            semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af \
            python3 scripts/security_corpus.py --output /evidence
      - name: Preserve security evidence
        if: always() && env.SECURITY_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-security-evidence
          path: |
            ${{ env.SECURITY_EVIDENCE }}/manifest.json
            ${{ env.SECURITY_EVIDENCE }}/rules.yml
            ${{ env.SECURITY_EVIDENCE }}/raw.json
            ${{ env.SECURITY_EVIDENCE }}/raw.log
            ${{ env.SECURITY_EVIDENCE }}/qualified.json
            ${{ env.SECURITY_EVIDENCE }}/qualified.log
          if-no-files-found: error
          retention-days: 14
      - name: Dependencies (osv-scanner)
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 scan source -r --allow-no-lockfiles .
      - name: Filesystem and IaC (trivy)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs node_modules --skip-dirs .venv .
      - name: Workflows (zizmor)
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --offline --min-severity medium .github/workflows
