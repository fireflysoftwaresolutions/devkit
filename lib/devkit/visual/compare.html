  The compare page of visual diagnosis. compare.py fills its three slots (a name in double braces) and opens the
  page from a private folder in the Chromium of the pinned Playwright: the policy slot becomes the Content Security
  Policy, with the hashes of this page's one style and one script; the job slot becomes the job, as escaped JSON;
  the pixelmatch slot becomes pixelmatch.js, pixelmatch 8.0.0 with its ISC notice, so `pixelmatch` is defined in
  the module that runs. The page loads nothing: it decodes the two pictures from the job's bytes, compares them,
  and leaves the result in globalThis.devkitCompare, with <html data-state> set to done or error. Its status line
  says what changed, the elements compared.py matched in the two descriptions included.
-->
<html lang="en" data-state="running">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{policy}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Picture comparison</title>
<style>
:root{color-scheme:light dark;--surface:#f3f1eb;--ink:#272820;--ink-2:#62645b;--strong:#10110f;--red-text:#a52a2a;
--amber:#ffb34a;--font:"Manrope","Manrope Variable",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--surface:#10110f;--ink:#f3f1eb;--ink-2:#bfb8ab;--strong:#ffffff;
--red-text:#f29b95}}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--surface);color:var(--ink);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--surface)}
::selection{background:var(--amber);color:#10110f}
main{max-width:72ch;padding:40px clamp(16px,4vw,32px)}
h1{margin:0 0 8px;font-size:19px;font-weight:600;line-height:1.25;color:var(--strong);text-wrap:balance}
#status{margin:0;color:var(--ink-2);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
[data-state=done] #status{color:var(--ink)}
[data-state=error] #status{color:var(--red-text)}
</style>
</head>
<body>
<main>
<h1>Picture comparison</h1>
<p id="status" role="status">Comparing the two pictures…</p>
</main>
<script type="application/json" id="job">{{job}}</script>
<script type="module">
{{pixelmatch}}
// The comparison, after pixelmatch's own code. The job, as compare.py writes it:
//   before, after   the two pictures, PNG bytes in base64 (the before picture is pixelmatch's first image)
//   anchor          the finding's boxes [x, y, w, h] in CSS px, compared as one region ("the box"); may be empty
//   scale           device pixels per CSS px of both pictures
//   threshold       pixelmatch's threshold (0.1); anti-aliasing detection stays on (includeAA: false)
//   band            rows compared in one pass
//   cell            device px of the grid that groups changed pixels outside the box into regions
//   max_regions     regions kept, largest first; regions_total counts them all
//   labels          {before, after}: the names the status line shows, as text
//   elements        {disappeared, appeared, moved, resized}: how many elements changed so, from the captures'
//                   descriptions; null when they were not compared
{
  const root = document.documentElement;
  const status = document.getElementById("status");
  const finish = (state, detail, text) => {
    globalThis.devkitCompare = Object.freeze({state, ...detail});
    status.textContent = text;
    root.dataset.state = state;
  };
  // pixelmatch's anti-aliasing test reads the pixels around a pixel and around its darkest and brightest
  // neighbors: two rows each way. A band read with two more rows above and below it gives every pixel in the band
  // the result a pass over the whole picture would give.
  const CONTEXT = 2;
  const count = new Intl.NumberFormat("en-US");
  const percent = new Intl.NumberFormat("en-US", {style: "percent", maximumFractionDigits: 1});
  const share = (v) => (v > 0 && v < 0.0005 ? "under 0.1%" : percent.format(v));
  const whole = (v, min) => Number.isInteger(v) && v >= min;
  const CHANGES = ["disappeared", "appeared", "moved", "resized"];

  const check = (job) => {
    const fields = [];
    if (typeof job.before !== "string" || typeof job.after !== "string") fields.push("before, after");
    if (!(typeof job.scale === "number" && job.scale > 0 && job.scale <= 8)) fields.push("scale");
    if (!(typeof job.threshold === "number" && job.threshold >= 0 && job.threshold <= 1)) fields.push("threshold");
    if (!whole(job.band, 1)) fields.push("band");
    if (!whole(job.cell, 1)) fields.push("cell");
    if (!whole(job.max_regions, 0)) fields.push("max_regions");
    if (!Array.isArray(job.anchor) || !job.anchor.every((b) => Array.isArray(b) && b.length === 4 &&
        b.every((v) => typeof v === "number" && Number.isFinite(v)) && b[2] > 0 && b[3] > 0)) fields.push("anchor");
    if (job.labels !== null && !(typeof job.labels === "object" && typeof job.labels.before === "string" &&
        typeof job.labels.after === "string")) fields.push("labels");
    if (job.elements !== null && !(typeof job.elements === "object" &&
        CHANGES.every((k) => whole(job.elements[k], 0)))) fields.push("elements");
    if (fields.length) throw new Error(`the job's ${fields.join(", ")} are not valid`);
  };

  const decode = async (job, which) => {
    try {
      return await createImageBitmap(new Blob([Uint8Array.fromBase64(job[which])], {type: "image/png"}),
                                     {colorSpaceConversion: "none", premultiplyAlpha: "none"});
    } catch {
      const name = job.labels ? ` (${job.labels[which]})` : "";
      throw new Error(`the ${which} picture${name} is not a PNG the browser can read. Capture it again.`);
    }
  };

  const comparePictures = async (job) => {
    const [before, after] = await Promise.all([decode(job, "before"), decode(job, "after")]);
    const W = Math.max(before.width, after.width);
    const H = Math.max(before.height, after.height);
    const s = job.scale;

    // the box in device px: the union of the anchor's boxes, clipped to the pictures
    const rects = job.anchor.map(([x, y, w, h]) => [Math.max(0, Math.floor(x * s)), Math.max(0, Math.floor(y * s)),
                                                     Math.min(W, Math.ceil((x + w) * s)), Math.min(H, Math.ceil((y + h) * s))])
      .filter(([x0, y0, x1, y1]) => x1 > x0 && y1 > y0);
    const bx0 = Math.min(W, ...rects.map((r) => r[0]));
    const by0 = Math.min(H, ...rects.map((r) => r[1]));
    const bw = Math.max(0, Math.max(0, ...rects.map((r) => r[2])) - bx0);
    const bh = Math.max(0, Math.max(0, ...rects.map((r) => r[3])) - by0);
    const boxMask = new Uint8Array(bw * bh);
    for (const [x0, y0, x1, y1] of rects) {
      for (let y = y0; y < y1; y++) boxMask.fill(1, (y - by0) * bw + x0 - bx0, (y - by0) * bw + x1 - bx0);
    }
    const inBox = (x, y) => x >= bx0 && x < bx0 + bw && y >= by0 && y < by0 + bh &&
                            boxMask[(y - by0) * bw + x - bx0] === 1;

    // changed pixels outside the box, counted per grid cell, with the extent they cover in each cell
    const cell = job.cell;
    const cols = Math.ceil(W / cell);
    const cells = cols * Math.ceil(H / cell);
    const hits = new Uint32Array(cells);
    const minX = new Int32Array(cells);
    const minY = new Int32Array(cells);
    const maxX = new Int32Array(cells);
    const maxY = new Int32Array(cells);

    const band = Math.min(job.band, H);
    const work = new OffscreenCanvas(W, Math.min(H, band + 2 * CONTEXT));
    const workContext = work.getContext("2d", {willReadFrequently: true});
    const diff = new OffscreenCanvas(W, H);
    const diffContext = diff.getContext("2d");
    const rows = (bitmap, top, h) => {
      workContext.clearRect(0, 0, W, work.height);
      const from = Math.min(h, bitmap.height - top);
      if (from > 0) workContext.drawImage(bitmap, 0, top, bitmap.width, from, 0, 0, bitmap.width, from);
      return workContext.getImageData(0, 0, W, h).data;
    };

    let pixels = 0;
    let boxPixels = 0;
    let changedInside = 0;
    let changedOutside = 0;
    for (let y0 = 0; y0 < H; y0 += band) {
      const top = Math.max(0, y0 - CONTEXT);
      const end = Math.min(H, y0 + band);
      const h = Math.min(H, end + CONTEXT) - top;
      const out = new Uint8ClampedArray(W * h * 4);
      pixelmatch(rows(before, top, h), rows(after, top, h), out, W, h, {threshold: job.threshold, includeAA: false});
      for (let y = y0; y < end; y++) {
        for (let x = 0, p = (y - top) * W * 4; x < W; x++, p += 4) {
          const inBefore = x < before.width && y < before.height;
          const inAfter = x < after.width && y < after.height;
          if (!inBefore && !inAfter) continue;
          pixels++;
          let changed;
          if (inBefore !== inAfter) {  // a pixel only one picture has
            out[p] = 255; out[p + 1] = 0; out[p + 2] = 0; out[p + 3] = 255;
            changed = true;
          } else {  // pixelmatch paints a changed pixel red (255, 0, 0) and every other pixel gray or yellow
            changed = out[p] === 255 && out[p + 1] === 0 && out[p + 2] === 0;
          }
          const inside = inBox(x, y);
          if (inside) boxPixels++;
          if (!changed) continue;
          if (inside) {
            changedInside++;
            continue;
          }
          changedOutside++;
          const c = Math.floor(y / cell) * cols + Math.floor(x / cell);
          if (hits[c]++ === 0) {
            minX[c] = maxX[c] = x;
            minY[c] = maxY[c] = y;
          } else {
            if (x < minX[c]) minX[c] = x;
            if (x > maxX[c]) maxX[c] = x;
            if (y > maxY[c]) maxY[c] = y;
          }
        }
      }
      diffContext.putImageData(new ImageData(out, W, h), 0, top, 0, y0 - top, W, end - y0);
    }

    // regions: cells with changes, joined with their eight neighbors, as boxes in CSS px around the changed pixels
    const seen = new Uint8Array(cells);
    const regions = [];
    for (let i = 0; i < cells; i++) {
      if (!hits[i] || seen[i]) continue;
      let n = 0;
      let x0 = W;
      let ry0 = H;
      let x1 = 0;
      let y1 = 0;
      const stack = [i];
      seen[i] = 1;
      while (stack.length) {
        const c = stack.pop();
        n += hits[c];
        x0 = Math.min(x0, minX[c]);
        ry0 = Math.min(ry0, minY[c]);
        x1 = Math.max(x1, maxX[c]);
        y1 = Math.max(y1, maxY[c]);
        const cx = c % cols;
        for (let dy = -cols; dy <= cols; dy += cols) {
          for (let dx = -1; dx <= 1; dx++) {
            const k = c + dy + dx;
            if (k >= 0 && k < cells && cx + dx >= 0 && cx + dx < cols && hits[k] && !seen[k]) {
              seen[k] = 1;
              stack.push(k);
            }
          }
        }
      }
      const left = Math.floor(x0 / s);
      const top = Math.floor(ry0 / s);
      regions.push({box: [left, top, Math.ceil((x1 + 1) / s) - left, Math.ceil((y1 + 1) / s) - top], pixels: n});
    }
    regions.sort((a, b) => b.pixels - a.pixels || a.box[1] - b.box[1] || a.box[0] - b.box[0]);

    const png = new Uint8Array(await (await diff.convertToBlob({type: "image/png"})).arrayBuffer());
    const outsidePixels = pixels - boxPixels;
    return {
      width: W, height: H, scale: s,
      sizes: {before: [before.width, before.height], after: [after.width, after.height]},
      pixels, changed: changedInside + changedOutside, box_pixels: boxPixels,
      inside: boxPixels ? changedInside / boxPixels : null,
      outside: outsidePixels ? changedOutside / outsidePixels : 0,
      regions: regions.slice(0, job.max_regions), regions_total: regions.length,
      diff: png.toBase64(),
    };
  };

  const sentence = (job, r) => {
    const names = job.labels ? `${job.labels.before} with ${job.labels.after}` : "the two pictures";
    if (!r.changed) return `Compared ${names}: no pixel changed.`;
    const where = r.regions_total === 1 ? "1 region" : `${count.format(r.regions_total)} regions`;
    const head = `Compared ${names}: ${count.format(r.changed)} of ${count.format(r.pixels)} pixels changed.`;
    if (r.inside === null) return `${head} ${r.regions_total ? `They are in ${where}.` : ""}`.trim();
    const outside = r.regions_total ? `${share(r.outside)}, in ${where}` : share(r.outside);
    return `${head} Inside the box: ${share(r.inside)}. Outside it: ${outside}.`;
  };
  const changedElements = (counts) => {
    if (counts === null) return "";
    const parts = CHANGES.filter((k) => counts[k]).map((k) => `${count.format(counts[k])} ${k}`);
    return parts.length ? ` Elements: ${parts.join(", ")}.` : " No element moved, resized, appeared, or disappeared.";
  };

  try {
    const job = JSON.parse(document.getElementById("job").textContent);
    check(job);
    if (job.labels) status.textContent = `Comparing ${job.labels.before} with ${job.labels.after}…`;
    const result = await comparePictures(job);
    finish("done", {result}, sentence(job, result) + changedElements(job.elements));
  } catch (error) {
    const message = String(error && error.message || error).slice(0, 300);
    finish("error", {message}, `Could not compare the pictures: ${message}`);
  }
}
</script>
</body>
</html>
