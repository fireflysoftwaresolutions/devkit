<!doctype html>
<!-- A same-origin frame of page.html: a one-time-code field at [10, 20, 200, 30] in the frame. -->
<html lang="en">
<head><meta charset="utf-8"><title>Same origin frame</title>
<style>body { margin: 0; font: 14px Arial, sans-serif; } input { position: absolute; left: 10px; top: 20px; width: 200px;
  height: 30px; box-sizing: border-box; }</style></head>
<body><label for="otp">Code</label><input id="otp" autocomplete="one-time-code" value="493817"></body>
</html>
