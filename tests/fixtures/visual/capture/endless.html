<!doctype html>
<!-- An endless list: the page starts 20,000 px high and grows by 2,000 px whenever its bottom comes into view. A
     paragraph every 1,000 px says where it is, so a test can tell which rows a description holds. -->
<html lang="en">
<head><meta charset="utf-8"><title>Endless list</title>
<style>body { margin: 0; font: 16px Arial, sans-serif; } #feed { position: relative; height: 20000px; }
.row { position: absolute; left: 16px; width: 300px; height: 20px; margin: 0; }
#end { position: absolute; left: 0; bottom: 0; width: 10px; height: 10px; }</style></head>
<body><h1 style="margin: 16px">Rows</h1>
<div id="feed"><div id="end"></div></div>
<script>
const feed = document.getElementById('feed');
const addRows = (from, to) => {
  for (let y = from; y < to; y += 1000) {
    const p = document.createElement('p');
    p.className = 'row';
    p.style.top = `${y}px`;
    p.textContent = `row at ${y}`;
    feed.appendChild(p);
  }
};
addRows(1000, 20000);
new IntersectionObserver((entries) => {
  if (!entries.some((e) => e.isIntersecting)) return;
  const height = feed.offsetHeight;
  feed.style.height = `${height + 2000}px`;
  addRows(height, height + 2000);
}).observe(document.getElementById('end'));
</script>
</body>
</html>
