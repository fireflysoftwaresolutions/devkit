<!doctype html>
<!-- What masked elements show outside their own box, on an 800 px page: nowrap text that runs past a 60 px masked box
     (#wide, at [16, 16, 60, 30]); the open menu of a masked button, positioned below and to the right of it (#menu at
     [16, 80, 100, 30], its menu at [216, 140, 300, 40]); and a masked wrapper with display: contents, which has no box
     of its own, around a paragraph at [16, 260, 300, 30]. The paragraph at [16, 320, 300, 30] is not masked. -->
<html lang="en">
<head><meta charset="utf-8"><title>Spilled masks</title>
<style>body { margin: 0; font: 24px Arial, sans-serif; background: #ffffff; color: #1a1a1a; }
#wide { position: absolute; left: 16px; top: 16px; width: 60px; height: 30px; white-space: nowrap; }
#menu { position: absolute; left: 16px; top: 80px; width: 100px; height: 30px; }
#menu div { position: absolute; left: 200px; top: 60px; width: 300px; height: 40px; background: #ffffff; }
.line { position: absolute; left: 16px; width: 300px; height: 30px; margin: 0; }</style></head>
<body>
<div id="wide" data-visual-mask>IBAN 98,765.43 private account 493817</div>
<div id="menu" data-visual-mask>Account<div>Card 493817 private</div></div>
<div data-visual-mask style="display: contents"><p class="line" style="top: 260px">Balance 98,765.43 private</p></div>
<p class="line" style="top: 320px">Invoices this month</p>
</body>
</html>
