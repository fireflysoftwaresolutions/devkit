<!doctype html>
<!-- A frame from a second origin (localhost): a card number field at [10, 20, 200, 30] in the frame. -->
<html lang="en">
<head><meta charset="utf-8"><title>Card frame</title>
<style>body { margin: 0; font: 14px Arial, sans-serif; background: #ffffff; } input { position: absolute; left: 10px;
  top: 20px; width: 200px; height: 30px; box-sizing: border-box; }</style></head>
<body><label for="cc">Card</label><input id="cc" autocomplete="cc-number" value="4111111111111111"></body>
</html>
