<!doctype html>
<!-- Spacing on a scale: paddings of 8, 16, 24, 32, and 48 px, used most, and one padding-top of 10 px (#off) that is
     on no scale but one that names it. -->
<html lang="en">
<head><meta charset="utf-8"><title>Spacing</title>
<style>body { margin: 0; font: 16px Arial, sans-serif; } .s8 { padding: 8px; } .s16 { padding: 16px; }
  .s24 { padding: 24px; } .s32 { padding: 32px; } .s48 { padding: 48px; } #off { padding-top: 10px; }</style></head>
<body>
<div class="s8">Eight</div><div class="s8">Eight</div><div class="s8">Eight</div>
<div class="s16">Sixteen</div><div class="s16">Sixteen</div>
<div class="s24">Twenty-four</div><div class="s32">Thirty-two</div><div class="s48">Forty-eight</div>
<div id="off">Ten</div>
</body>
</html>
