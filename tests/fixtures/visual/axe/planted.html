<!doctype html>
<!--
  The page tests/test_visual_axe.py runs axe-core and checks.js on, at 390x844. Each planted defect is an element with
  data-expect: the signals it must give, as axe:<axe rule>, axe-review:<axe rule> (a node axe could not decide), or
  devkit:<checks.js check>; no other element may give one.
  The image gives one signal of each source on one element, which fold.js folds into one. The frame's document has no
  title, on purpose: document-title is a rule of the top document, which axe does not run in a frame.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #ffffff; }
  main { padding: 24px; }
  h1 { margin: 0 0 16px; font-size: 24px; }
  .muted { color: #aaaaaa; } /* 2.32:1 on white; 4.5:1 is the minimum for 16 px text */
  .toolbar { display: flex; gap: 2px; align-items: center; margin: 16px 0; }
  .toolbar button, .settings { font: inherit; color: #1a1a1a; background: #ffffff; border: 1px solid #1a1a1a; }
  /* 16x16, 2 px from Export: its safe clickable space is 2 x (8 + 2) = 20 px across, under the 24 px minimum */
  .dismiss { width: 16px; height: 16px; padding: 0; box-sizing: border-box; }
  .export { min-width: 88px; min-height: 44px; }
  .settings { display: block; width: 44px; height: 44px; margin: 16px 0; } /* no text and no label */
  .logo { display: block; width: 120px; height: 80px; } /* a picture that does not load, with no alt */
  .due { padding: 8px; background-image: linear-gradient(#ffffff, #f2f2f2); } /* axe cannot measure text on a gradient */
  iframe { display: block; width: 320px; height: 64px; margin: 24px 0 0 8px; padding: 6px; border: 2px solid #1a1a1a; }
</style>
</head>
<body>
<main>
  <h1>Invoices</h1>
  <p id="vat" class="muted" data-expect="axe:color-contrast">Totals include VAT</p>
  <div class="toolbar">
    <button id="dismiss" class="dismiss" type="button" aria-label="Dismiss" data-expect="axe:target-size devkit:tap-target"></button>
    <button class="export" type="button">Export</button>
  </div>
  <button id="settings" class="settings" type="button" data-expect="axe:button-name"></button>
  <img id="logo" class="logo" src="logo-not-here.png" width="120" height="80" data-expect="axe:image-alt devkit:broken-image">
  <p id="due" class="due" data-expect="axe-review:color-contrast">Pay before the 15th</p>
  <iframe name="totals" title="Totals" srcdoc="<!doctype html><html lang='en'><body style='margin:0;font:16px/1.5 system-ui,sans-serif;background:#ffffff'><p id='paid' data-expect='axe:color-contrast' style='margin:8px;color:#b3b3b3'>Paid in October</p></body></html>"></iframe>
</main>
</body>
</html>
