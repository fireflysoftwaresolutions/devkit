# devkit default prose rules (used by `dev docs check` when a repository has no .vale.ini).
StylesPath = {{STYLES}}
MinAlertLevel = warning
Packages = Google, write-good
# Vale checks front-matter values as prose. A plan's record fields (dev plan) are data: ids, slugs, people, times.
# The title stays checked. The list replaces Vale's own (code, tt, kbd, samp), so it repeats them.
IgnoredScopes = code, tt, kbd, samp, text.frontmatter.id, text.frontmatter.kind, text.frontmatter.scope, text.frontmatter.status, text.frontmatter.version, text.frontmatter.body_sha, text.frontmatter.created, text.frontmatter.updated, text.frontmatter.supersedes

[*.md]
BasedOnStyles = Vale, Google, write-good
# Code, tables of identifiers and product names are not prose
Google.Headings = NO
Google.Parens = NO
Google.Acronyms = NO
Google.WordList = suggestion
write-good.E-Prime = NO
write-good.Passive = suggestion
write-good.TooWordy = suggestion
Vale.Spelling = NO
TokenIgnores = (`[^`]+`), (\$\{[^}]+\})
