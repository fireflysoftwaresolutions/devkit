# devkit default prose rules (used by `dev docs check` when a repository has no .vale.ini).
StylesPath = {{STYLES}}
MinAlertLevel = warning
Packages = Google, write-good

[*.md]
BasedOnStyles = Vale, Google, write-good
# Code, tables of identifiers and product names are not prose
Google.Headings = NO
Google.Parens = NO
Google.Acronyms = NO
Google.WordList = suggestion
write-good.E-Prime = NO
write-good.Passive = suggestion
write-good.TooWordy = suggestion
Vale.Spelling = NO
TokenIgnores = (`[^`]+`), (\$\{[^}]+\})
