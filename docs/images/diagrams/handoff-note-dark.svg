<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="1184" viewBox="0 0 1184 1184" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">Anatomy of a handoff note</title>
<desc id="dk-desc">A handoff note, projects/&lt;project id&gt;.md in the handoff repository, has eight parts in this order: frontmatter, the auto block, Purpose, Current state, Tasks, Decisions and gotchas, Links and the session log. dev note set writes the frontmatter, dev sync writes the auto block, the agents' handoff skill writes the narrative sections, dev task writes the tasks and the session hooks add a session line with branch, commits and the DevKit status line. Session context, dev overview and the dashboard read the note.</desc>
