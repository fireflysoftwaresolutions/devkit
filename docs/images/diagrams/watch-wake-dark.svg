<text x="108.0" y="345.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">prints the question, exits 0</text>
<path d="M0.0,416.0 L440.5,416.0" fill="none" stroke="#BFB8AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="448.0,416.0 440.0,420.0 440.0,412.0" fill="#BFB8AB"/>
<rect x="165.0" y="386.0" width="117.9" height="22.0" rx="9" fill="#10110F"/>
<text x="224.0" y="401.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">dev crew answer</text>
<path d="M0.0,472.0 L208.5,472.0" fill="none" stroke="#BFB8AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="216.0,472.0 208.0,476.0 208.0,468.0" fill="#BFB8AB"/>
