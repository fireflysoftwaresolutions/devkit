<svg xmlns="http://www.w3.org/2000/svg" width="952" height="696" viewBox="0 0 952 696" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">One wait wakes the idle session</title>
<desc id="dk-desc">The tech lead arms one devkit wait before it ends its turn. A crew member's question lands in the run file; the wait sees the file change, prints the question once and exits, and the harness wakes the session, which answers and arms the wait again.</desc>
<rect width="952" height="696" fill="#10110F"/>
<g font-family="Manrope, 'Manrope Variable', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<circle cx="68" cy="74" r="4" fill="#FFB34A"/>
<text x="80" y="78.5" font-size="12" font-weight="600" fill="#BFB8AB" letter-spacing="0.48">ONE WAIT WAKES THE IDLE SESSION</text>
<g transform="translate(132.0,104.0)">
<line x1="0.0" y1="80.0" x2="0.0" y2="576.0" stroke="#383A33" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="216.0" y1="80.0" x2="216.0" y2="576.0" stroke="#383A33" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="448.0" y1="80.0" x2="448.0" y2="576.0" stroke="#383A33" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="680.0" y1="80.0" x2="680.0" y2="576.0" stroke="#383A33" stroke-width="1.5" stroke-dasharray="4 4"/>
