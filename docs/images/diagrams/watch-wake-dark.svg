<rect x="469.1" y="498.0" width="189.9" height="22.0" rx="9" fill="#10110F"/>
<text x="564.0" y="513.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">answer at its next call or wait</text>
<rect x="-68.0" y="0.0" width="136.0" height="80.0" rx="6.0" fill="#1F201C" stroke="#4C4E45" stroke-width="1.5"/>
<text x="0.0" y="34.0" font-size="16" font-weight="600" fill="#F3F1EB" text-anchor="middle">Tech lead</text>
<text x="0.0" y="56.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">main session</text>
<rect x="132.0" y="0.0" width="168.0" height="80.0" rx="6.0" fill="#2C2416" stroke="#FFB34A" stroke-width="1.5"/>
<text x="216.0" y="34.0" font-size="16" font-weight="600" fill="#F3F1EB" text-anchor="middle">dev watch --wait</text>
<text x="216.0" y="56.0" font-size="13" font-weight="400" fill="#FFB34A" text-anchor="middle">background task</text>
<rect x="340.0" y="0.0" width="216.0" height="80.0" rx="6.0" fill="#293235" stroke="#8EA3AB" stroke-width="1.5"/>
<text x="448.0" y="34.0" font-size="16" font-weight="600" fill="#F3F1EB" text-anchor="middle">Run and session files</text>
<text x="448.0" y="56.0" font-size="13" font-weight="400" fill="#A4B4B9" text-anchor="middle">devkit state</text>
<rect x="604.0" y="0.0" width="152.0" height="80.0" rx="6.0" fill="#1F201C" stroke="#4C4E45" stroke-width="1.5"/>
<text x="680.0" y="34.0" font-size="16" font-weight="600" fill="#F3F1EB" text-anchor="middle">Crew member</text>
<text x="680.0" y="56.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">subagent</text>
</g>
</g>
</svg>
