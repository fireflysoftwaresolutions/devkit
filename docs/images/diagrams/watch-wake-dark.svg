<rect x="33.0" y="106.0" width="149.9" height="22.0" rx="9" fill="#10110F"/>
<text x="108.0" y="121.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">arm, then end the turn</text>
<path d="M680.0,192.0 L455.5,192.0" fill="none" stroke="#BFB8AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="448.0,192.0 456.0,188.0 456.0,196.0" fill="#BFB8AB"/>
<rect x="516.4" y="162.0" width="95.2" height="22.0" rx="9" fill="#10110F"/>
<text x="564.0" y="177.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">dev crew ask</text>
<path d="M448.0,248.0 L223.5,248.0" fill="none" stroke="#BFB8AB" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" stroke-linecap="butt"/><polygon points="216.0,248.0 224.0,244.0 224.0,252.0" fill="#BFB8AB"/>
<rect x="287.3" y="218.0" width="89.4" height="22.0" rx="9" fill="#10110F"/>
<text x="332.0" y="233.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">file changed</text>
<path d="M216.0,304.0 L440.5,304.0" fill="none" stroke="#BFB8AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="448.0,304.0 440.0,308.0 440.0,300.0" fill="#BFB8AB"/>
<rect x="236.7" y="274.0" width="190.6" height="22.0" rx="9" fill="#10110F"/>
<text x="332.0" y="289.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">take what is new, mark it told</text>
<path d="M216.0,360.0 L9.5,360.0" fill="none" stroke="#FFB34A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="0.0,360.0 10.0,355.0 10.0,365.0" fill="#FFB34A"/>
