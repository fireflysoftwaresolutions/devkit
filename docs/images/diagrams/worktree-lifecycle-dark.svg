<text x="936.0" y="56.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">a session works in it</text>
<rect x="828.0" y="152.0" width="216.0" height="80.0" rx="40.0" fill="#1F201C" stroke="#4C4E45" stroke-width="1.5"/>
<text x="936.0" y="186.0" font-size="16" font-weight="600" fill="#F3F1EB" text-anchor="middle">Idle</text>
<text x="936.0" y="208.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">build output pruned at 7 days</text>
<rect x="828.0" y="304.0" width="216.0" height="80.0" rx="40.0" fill="#2E3126" stroke="#959C7F" stroke-width="1.5"/>
<text x="936.0" y="338.0" font-size="16" font-weight="600" fill="#F3F1EB" text-anchor="middle">Kept</text>
<text x="936.0" y="360.0" font-size="13" font-weight="400" fill="#B9BF9F" text-anchor="middle">while work could be lost</text>
<rect x="412.0" y="152.0" width="216.0" height="80.0" rx="40.0" fill="#1F201C" stroke="#4C4E45" stroke-width="1.5"/>
<text x="520.0" y="186.0" font-size="16" font-weight="600" fill="#F3F1EB" text-anchor="middle">Merged</text>
<text x="520.0" y="208.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">PR merged or in main</text>
<rect x="4.0" y="152.0" width="216.0" height="80.0" rx="40.0" fill="#FFB34A" stroke="#FFB34A" stroke-width="2"/>
<text x="112.0" y="186.0" font-size="16" font-weight="600" fill="#272820" text-anchor="middle">Removed</text>
<text x="112.0" y="208.0" font-size="13" font-weight="400" fill="#272820" text-anchor="middle">dev gc · dev wt rm</text>
<circle cx="112.0" cy="344.0" r="11" fill="none" stroke="#F3F1EB" stroke-width="2"/><circle cx="112.0" cy="344.0" r="6" fill="#F3F1EB"/>
</g>
