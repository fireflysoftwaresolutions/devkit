<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="824" viewBox="0 0 1152 824" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">How Morpheus leads the crew</title>
<desc id="dk-desc">The developer gives Morpheus, the main session, a goal. Morpheus plans the steps with their dependencies and briefs crew members, each in its own lane with its own files, up to four at once. Members send questions and decisions back to Morpheus, who asks the developer the decisions that are theirs. At SubagentStop, the crew canary checks that each report starts with the member's status block before it reaches Morpheus. After the push, CI watch follows the run and sends a failure's diagnosis to Morpheus, who hands the fix to Link.</desc>
