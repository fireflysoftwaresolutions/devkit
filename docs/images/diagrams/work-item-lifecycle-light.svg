<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="720" viewBox="0 0 1128 720" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">Life of a work item</title>
<desc id="dk-desc">A work item starts as todo when dev task add creates it. dev task start (or claim) takes an 8-hour lock and makes it doing; the lock is renewed only while a session works on the item's branch. release or delegate gives the lock back and returns the item to todo, and so does a lock that runs out. done releases the lock and closes the item, and so does dev pr merge of the item's branch. block, with a reason, marks an item blocked, and unblock returns it to todo (or to doing while it is still claimed). cancel, with a reason, closes any open item.</desc>
