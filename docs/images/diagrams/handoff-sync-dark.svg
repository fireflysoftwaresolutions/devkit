<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="1072" viewBox="0 0 1208 1072" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">Two machines, one handoff repository</title>
<desc id="dk-desc">Sequence of a task lock between two developers' machines. Maria's agent claims a task with dev task start: devkit pulls, writes the lock into the item's file and pushes it to the handoff repository on GitHub at once. Jordan's machine pulls at session start and on every sync, so Jordan's agent is told the task is claimed, and its own claim is refused. While Maria works, the Stop hook renews the lock and publishes presence and the session line. dev task done releases the lock and pushes at once; a lock that nobody renews for 8 hours is released by the hourly sync on any machine.</desc>
