<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="776" viewBox="0 0 1032 776" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">Life of a work item</title>
<desc id="dk-desc">A work item starts as todo when dev task add creates it. dev task start (or claim) takes an 8-hour lock and makes it doing; release or delegate gives the lock back and returns it to todo, and done releases the lock and closes the item. A lock that is not renewed for 8 hours expires: the item stays doing, unlocked, and anyone may claim it. block marks an item blocked, and release returns a blocked item to todo. cancel, with a reason, closes any open item.</desc>
