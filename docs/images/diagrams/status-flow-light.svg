<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="552" viewBox="0 0 1184 552" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">Progress and the status block</title>
<desc id="dk-desc">The agent records long work with dev progress, which keeps the run's steps, estimate and ETA and shares them with the team through presence, dev team and the dashboard. Every final message starts with the status block. After each turn the Stop hook reads the block, records whether the marker was there and how well the format was followed in the canary log, and stores the block as one compact line, which dev status, dev overview, the dashboard and the next session show.</desc>
