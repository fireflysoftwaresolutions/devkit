<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="824" viewBox="0 0 1232 824" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">How the tech lead (Morpheus) leads the crew</title>
<desc id="dk-desc">The developer gives the tech lead (Morpheus), the main session, a goal. The tech lead plans the steps with their dependencies and briefs crew members, each in its own lane with its own files, up to the slot limit (four by default, lower when usage is high). Members send questions and decisions back to the tech lead, who asks the developer the decisions that are theirs. At SubagentStop, devkit checks each report before it reaches the tech lead: the member's status block, its recorded step, and the crew gates. After the push, CI watch follows the run and sends a failure's diagnosis to the tech lead, who hands the fix to the Release engineer (Link).</desc>
