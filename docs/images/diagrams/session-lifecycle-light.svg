<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1144" viewBox="0 0 1200 1144" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">A session with devkit</title>
<desc id="dk-desc">Sequence of one agent session. At session start the devkit hooks read the project's handoff note, tasks and last status from the handoff repository and give the agent its workspace context. On every tool call the guard allows the action or denies it with the right way to do it. At the end of every reply the agent starts with the DevKit status line; the Stop hook checks it and records the status and the session line. At session end devkit syncs the map and notes and pushes the private handoff repository to GitHub.</desc>
