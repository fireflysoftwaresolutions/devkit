<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="704" viewBox="0 0 1056 704" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">From plan to operate</title>
<desc id="dk-desc">The development lifecycle with devkit, stage by stage, with the command and skill for each: plan with dev plan new and Superpowers; track the task with dev task; build with dev progress and the required skills; pass the local test gate with dev ci and dev sec scan; review with /code-review and the communicating templates; integrate on one branch with the delivery skill; release by the recorded policy with dev delivery and the release-policy skill; follow CI with dev ci status; deploy through a tag and its pipeline; and hand off with the handoff skill and dev sync. Each stage feeds the next, so there is no gap between plan and operate.</desc>
