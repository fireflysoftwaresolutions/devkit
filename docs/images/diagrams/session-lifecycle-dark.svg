<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="1424" viewBox="0 0 1232 1424" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">A session with devkit</title>
<desc id="dk-desc">Sequence of one agent session. At session start the devkit hooks pull the handoff repository, read the project's handoff note, tasks, locks, and the lessons that apply, and give the agent its workspace context. On each prompt the hooks start the turn clock and, when you ask how it is going, add the real progress records. On every tool call the guard allows the action or denies it with the right way to do it; after a commit, push, merge, tag, PR, or release the hooks sync the handoff repository within seconds, and after slow work they remind the agent to update you. Every final message starts with the status block; the Stop hook checks it, records the status, the session line and the lock renewal, and after a fix or revert asks once for a lesson. At session end devkit syncs the map and notes and pushes the private handoff repository to GitHub.</desc>
