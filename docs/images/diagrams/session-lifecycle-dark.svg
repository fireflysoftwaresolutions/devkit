<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="1368" viewBox="0 0 1208 1368" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">A session with devkit</title>
<desc id="dk-desc">Sequence of one agent session. At session start the devkit hooks read the project's handoff note, tasks, locks and last status from the handoff repository and give the agent its workspace context. On each prompt the hooks start the turn clock and, when you ask how it is going, add the real progress records. On every tool call the guard allows the action or denies it with the right way to do it, and after slow work the hooks remind the agent to update you. Every final message starts with the status block; the Stop hook checks it and records the status, the session line and the lock renewal. At session end devkit syncs the map and notes and pushes the private handoff repository to GitHub.</desc>
