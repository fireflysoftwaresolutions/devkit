<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="1032" viewBox="0 0 1168 1032" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">The life of a lesson</title>
<desc id="dk-desc">Signals such as fix and revert commits, repeated guard refusals, missed status blocks, bouncing tasks, and corrections from the developer prompt a lesson. dev lesson add captures it in lessons/&lt;scope&gt;/ in the handoff repository. Every session recalls the open lessons that apply as known pitfalls. When one happens again, dev lesson recur counts the repeat, and a recurring lesson is turned into automation with dev lesson prevent (a test, lint rule, guard rule, required skill, or CI check). Every night dev sleep merges near-duplicates and forgets lessons that no longer help into lessons/archive/, from where dev lesson restore brings one back.</desc>
