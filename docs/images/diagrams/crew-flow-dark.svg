<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1248" viewBox="0 0 920 1248" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">How work flows through the crew</title>
<desc id="dk-desc">A request moves from the tech lead (Morpheus) through requirements, research, and architecture, each only when it applies, then build, review and security, and release. Each stage hands the next one an artifact: plan steps, a spec with criterion ids, a spike note, an ADR, commits with tests, an approval. A failure at any stage goes to debug, where the cause is proven before the fix returns with its regression test.</desc>
