<title id="dk-title">How work is organized</title>
<desc id="dk-desc">The portfolio is every initiative and project in the handoff repository. An initiative groups the projects that work toward one goal and holds the cross-project tasks; a project can also stand alone. Each scope, a project or an initiative, has its own work items, plans and session log.</desc>
