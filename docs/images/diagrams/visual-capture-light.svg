<svg xmlns="http://www.w3.org/2000/svg" width="1224" height="568" viewBox="0 0 1224 568" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">What a capture stores, and where</title>
<desc id="dk-desc">The capture driver reads the local app's page in a temporary folder that it deletes afterward, and hands its picture, text, and check signals to redaction in memory. Only after redaction does anything reach the disk: pictures and descriptions go to the local store on this Mac, and the text records go to the handoff repository. Form values, cookies, and storage are never stored.</desc>
