<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="728" viewBox="0 0 1072 728" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">Scheduled jobs and the audit trail</title>
<desc id="dk-desc">launchd starts each scheduled job on its schedule as dev jobs exec &lt;name&gt;, which runs the job's dev command one at a time and with a timeout. The output goes to the job's log, the result (exit code, duration, last line) to the journal, and a job record to the audit trail, which also receives every changing dev command, guard decision, and handoff write. A failed job sends a notification. dev jobs and dev doctor read the journal, and the daily audit job publishes this machine's audit trail to audit/&lt;user&gt;@&lt;host&gt;/ in the handoff repository, where dev audit --team reads the whole team's.</desc>
