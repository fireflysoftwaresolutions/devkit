<rect x="43.2" y="162.0" width="137.7" height="22.0" rx="9" fill="#10110F"/>
<text x="112.0" y="177.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">dev session ask @b</text>
