<text x="112.0" y="625.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">settled</text>
<path d="M224.0,696.0 L456.0,696.0" fill="none" stroke="#BFB8AB" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" stroke-linecap="butt"/><polyline points="448.0,700.0 456.0,696.0 448.0,692.0" fill="none" stroke="#BFB8AB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
