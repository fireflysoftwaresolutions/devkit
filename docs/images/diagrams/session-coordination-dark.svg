<text x="0.0" y="56.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">tech lead, Claude Code</text>
<rect x="140.0" y="0.0" width="168.0" height="80.0" rx="6.0" fill="#2C2416" stroke="#FFB34A" stroke-width="1.5"/>
<text x="224.0" y="34.0" font-size="16" font-weight="600" fill="#F3F1EB" text-anchor="middle">devkit</text>
<text x="224.0" y="56.0" font-size="13" font-weight="400" fill="#FFB34A" text-anchor="middle">peers store, this Mac</text>
<rect x="384.0" y="0.0" width="144.0" height="80.0" rx="6.0" fill="#1F201C" stroke="#4C4E45" stroke-width="1.5"/>
<text x="456.0" y="34.0" font-size="16" font-weight="600" fill="#F3F1EB" text-anchor="middle">Session B</text>
<text x="456.0" y="56.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">tech lead, Codex</text>
<rect x="572.0" y="0.0" width="136.0" height="80.0" rx="6.0" fill="#222726" stroke="#7C8583" stroke-width="1.5"/>
<text x="640.0" y="34.0" font-size="16" font-weight="600" fill="#F3F1EB" text-anchor="middle">Developer</text>
<text x="640.0" y="56.0" font-size="13" font-weight="400" fill="#A7AEAC" text-anchor="middle">at the keyboard</text>
</g>
</g>
</svg>
