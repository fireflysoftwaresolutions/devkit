<svg xmlns="http://www.w3.org/2000/svg" width="928" height="864" viewBox="0 0 928 864" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">Sessions on one Mac</title>
<desc id="dk-desc">Session A asks session B a question through devkit, which wakes B's wait; B's answer wakes A's wait. When they disagree, A escalates, devkit notifies the developer, and the developer's typed settle line reaches both sessions.</desc>
