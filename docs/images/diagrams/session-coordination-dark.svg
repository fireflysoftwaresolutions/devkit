<text x="432.0" y="569.0" font-size="13" font-weight="400" fill="#BFB8AB" text-anchor="middle">types settle E-…: A</text>
<path d="M224.0,640.0 L0.0,640.0" fill="none" stroke="#BFB8AB" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" stroke-linecap="butt"/><polyline points="8.0,636.0 0.0,640.0 8.0,644.0" fill="none" stroke="#BFB8AB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
