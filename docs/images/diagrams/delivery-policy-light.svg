<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1016" viewBox="0 0 1024 1016" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">Delivery policy</title>
<desc id="dk-desc">dev delivery detects what a repository does today (version tags and files, release tools, changelog, CI, the test gate, branches, what it publishes and deploys), recommends a policy that keeps what works, and lists the gaps. dev delivery apply records the policy with a reason in policies/&lt;scope&gt;.json in the handoff repository, versioned with its history, and --tasks opens a work item for each gap. Every session then sees the policy in its context, the guard refuses tags that break it, and releases follow it with dev calver and the release-policy skill.</desc>
