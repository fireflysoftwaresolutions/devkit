<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="816" viewBox="0 0 1168 816" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">How devkit fits together</title>
<desc id="dk-desc">The devkit repository installs rules, the devkit plugin and hooks into the agents: Claude Code (CLI and Desktop) and Codex (CLI and the ChatGPT app). The agents work in your repositories under ~/Development and, through the hooks, read context from and record sessions in the private handoff repository, which an hourly sync keeps current. Repositories and the handoff repository are pushed to GitHub; the dashboard and the overview read the handoff repository.</desc>
