<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="584" viewBox="0 0 1072 584" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">Local-first delivery: one push, one CI run</title>
<desc id="dk-desc">Feature branches are integrated on one local integration or release branch, where dev ci --run runs the same commands as CI and records the evidence. Only when the local suite is green does dev push push the branch once and dev pr create open one pull request, so CI runs once. If CI fails, the failure is reproduced and fixed locally before the next push. A green CI run is merged with dev pr merge, tagged and released with dev release under a CalVer version, and the published artifact is verified.</desc>
