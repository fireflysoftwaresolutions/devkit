<svg xmlns="http://www.w3.org/2000/svg" width="1224" height="1160" viewBox="0 0 1224 1160" role="img" aria-labelledby="dk-title dk-desc">
<title id="dk-title">When devkit itself fails</title>
<desc id="dk-desc">A devkit failure on your Mac gets a fingerprint, and devkit matches it against the local cache of the bug registry without any network call. A known bug with a trusted detour gives the agent the detour, and the work goes on; otherwise the agent looks for its own detour or reports the bug. Votes, reports, and detours leave through the checked outbox for the registry in GitHub Issues, which ranks the bugs for the next hotfix, and dev bug sync brings the registry's records back into the cache.</desc>
